name: mmhand-ros
channels:
  - conda-forge
  - robostack-jazzy
dependencies:
  - python=3.12
  - ros-jazzy-ros-base
  - ros-jazzy-geometry-msgs
  - ros-jazzy-std-msgs
  - ros-jazzy-rmw-cyclonedds-cpp
  - numpy=1.26
  - scipy=1.13
  - cython>=3.0
  - setuptools>=83.0
  - wheel>=0.47.0
  - websockets=10.4
  - python-can>=3.3.4
  - pyusb
  - gs-usb>=0.3.1
  - roboticstoolbox-python=1.3.0
  - spatialmath-python=1.1.16
  - spatialgeometry=1.1.0
  - swift-sim=1.1.0
variables:
  PYTHONNOUSERSITE: "1"
