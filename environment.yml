name: mmhand-ros
channels:
  - conda-forge
  - robostack-jazzy
dependencies:
  - python=3.12
  - ros-jazzy-ros-base
  - ros-jazzy-geometry-msgs
  - ros-jazzy-std-msgs
  - ros-jazzy-rmw-cyclonedds-cpp
  - numpy>=1.26
  - nicegui=3.16.0
  - cython>=3.0
  - setuptools>=83.0
  - wheel>=0.47.0
  - python-can>=3.3.4
  - pyusb
  - gs-usb>=0.3.1
  - pytest
  - pytest-asyncio
variables:
  PYTHONNOUSERSITE: "1"
